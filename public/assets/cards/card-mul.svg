  <text x="100" y="150" font-family="Arial, sans-serif" font-size="96" font-weight="bold"
        fill="#e9a6ff" text-anchor="middle" filter="url(#gm)">&#215;2</text>
  <text x="100" y="40" font-family="Arial, sans-serif" font-size="18" font-weight="bold"
        fill="#c026ff" text-anchor="middle" letter-spacing="3">MUL</text>
  <text x="100" y="246" font-family="Arial, sans-serif" font-size="13"
        fill="#94a3b8" text-anchor="middle">multiply damage &#215;2</text>
