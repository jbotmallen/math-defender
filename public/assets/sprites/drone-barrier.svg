<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="dcyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7df9ff"/>
      <stop offset="1" stop-color="#1f9fb8"/>
    </linearGradient>
    <filter id="dglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#dglow)">
    <!-- top + bottom rotor arms -->
    <rect x="12" y="6" width="40" height="6" rx="3" fill="#0e1726" stroke="#22d3ee" stroke-width="1.5"/>
    <rect x="12" y="52" width="40" height="6" rx="3" fill="#0e1726" stroke="#22d3ee" stroke-width="1.5"/>
    <!-- rotor hubs -->
    <circle cx="16" cy="9" r="4" fill="#7df9ff"/>
    <circle cx="48" cy="9" r="4" fill="#7df9ff"/>
    <circle cx="16" cy="55" r="4" fill="#7df9ff"/>
    <circle cx="48" cy="55" r="4" fill="#7df9ff"/>
    <!-- central body -->
    <rect x="22" y="20" width="20" height="24" rx="6" fill="url(#dcyan)" stroke="#7df9ff" stroke-width="1.5"/>
    <!-- scanner eye -->
    <circle cx="32" cy="32" r="5" fill="#0e1726" stroke="#7df9ff" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="2" fill="#ff3b5c"/>
  </g>
</svg>
