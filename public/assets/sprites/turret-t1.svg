<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7df9ff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- base -->
    <rect x="18" y="44" width="28" height="14" rx="4" fill="#0e1726" stroke="#22d3ee" stroke-width="2"/>
    <!-- barrel -->
    <polygon points="32,6 44,40 20,40" fill="url(#cyan)" stroke="#7df9ff" stroke-width="1.5"/>
    <!-- core glow -->
    <circle cx="32" cy="34" r="5" fill="#7df9ff"/>
  </g>
</svg>
