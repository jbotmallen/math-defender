<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyan2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7df9ff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow2)">
    <rect x="14" y="44" width="36" height="15" rx="4" fill="#0e1726" stroke="#22d3ee" stroke-width="2"/>
    <!-- twin barrels -->
    <polygon points="22,12 30,42 14,42" fill="url(#cyan2)" stroke="#7df9ff" stroke-width="1.5"/>
    <polygon points="42,12 50,42 34,42" fill="url(#cyan2)" stroke="#7df9ff" stroke-width="1.5"/>
    <circle cx="32" cy="50" r="6" fill="#0e1726" stroke="#7df9ff" stroke-width="2"/>
    <circle cx="32" cy="50" r="2.5" fill="#7df9ff"/>
  </g>
</svg>
